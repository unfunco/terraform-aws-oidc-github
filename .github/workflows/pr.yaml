name: PR

on:
  pull_request: { }

jobs:
  verify:
    name: Verify
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@dc15f9a32fe01b1b7cc44e095ab9e9bdd98bb0b7
    with:
      terraform-version-file: .terraform-version
      working-directory: .

  test:
    name: Test
    needs: [ verify ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read Terraform version
      id: terraform-version
      run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
    - name: Initialise with no backend
      run: terraform init -backend=false -input=false
    - name: Run unit tests
      run: terraform test
